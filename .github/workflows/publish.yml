name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Validate packaging without publishing to npm'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish workspace packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Trusted publishing requires npm >= 11.5.1.
      - name: Install latest npm
        run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      - name: Verify release tag matches @larkflare/db
        if: github.event_name == 'release'
        run: |
          version="$(node -p "require('./packages/db/package.json').version")"
          tag="${{ github.event.release.tag_name }}"
          tag="${tag#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Release tag '${{ github.event.release.tag_name }}' does not match @larkflare/db version '$version'."
            exit 1
          fi

      - name: Ensure manual publish runs from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Manual publishes must be dispatched from the main branch (got '${{ github.ref }}')."
          exit 1

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish unpublished workspace packages
        run: |
          set -euo pipefail
          for dir in packages/db packages/d1 packages/vectorize packages/r2; do
            name="$(node -p "require('./$dir/package.json').name")"
            version="$(node -p "require('./$dir/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::notice::$name@$version is already published; skipping."
              continue
            fi
            if [ "${{ inputs['dry-run'] }}" = "true" ]; then
              pnpm --filter "$name" publish --dry-run --access public --no-git-checks
            else
              pnpm --filter "$name" publish --provenance --access public --no-git-checks
            fi
          done
